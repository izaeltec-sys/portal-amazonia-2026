name: Refine Regulamento - Central do Atleta

on:
  push:
    branches:
      - feat/regulamento-central-link
    paths:
      - '.github/workflows/refine-regulamento-central.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/regulamento-central-link

      - name: Ajustar encaixe responsivo do botão
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_actions = '''      <button class="ghost sumario-btn" id="sumarioBtn" aria-controls="sumario" aria-expanded="false" onclick="toggleSumario()">☰ Sumário</button>\n      <a class="button-link goldbtn central-atleta-btn" href="./central/" title="Abrir Central do Atleta">Central do Atleta</a>\n      <button class="primary" onclick="window.print()">Imprimir / Gerar PDF</button>'''
          new_actions = '''      <button class="ghost sumario-btn" id="sumarioBtn" aria-controls="sumario" aria-expanded="false" onclick="toggleSumario()">☰ Sumário</button>\n      <button class="primary" onclick="window.print()">Imprimir / Gerar PDF</button>\n      <a class="button-link goldbtn central-atleta-btn" href="./central/" title="Abrir Central do Atleta">Central do Atleta</a>'''
          if old_actions not in text:
              raise SystemExit('Bloco esperado do cabeçalho não encontrado.')
          text = text.replace(old_actions, new_actions, 1)

          old_900 = '  .toolbar button{padding:9px 12px;font-size:12px;white-space:nowrap}'
          new_900 = '  .toolbar button,.toolbar .button-link{padding:9px 12px;font-size:12px;white-space:nowrap}'
          if old_900 not in text:
              raise SystemExit('Regra responsiva de 900px não encontrada.')
          text = text.replace(old_900, new_900, 1)

          old_520 = '  .toolbar button{width:100%;min-height:42px;padding:8px 9px;font-size:11.5px}'
          new_520 = '  .toolbar button,.toolbar .button-link{width:100%;min-height:42px;padding:8px 9px;font-size:11.5px}\n  .central-atleta-btn{grid-column:1/-1}'
          if old_520 not in text:
              raise SystemExit('Regra responsiva de 520px não encontrada.')
          text = text.replace(old_520, new_520, 1)
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/refine-regulamento-central.yml')
          workflow.unlink()

      - name: Mostrar diff
        run: git diff -- index.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/refine-regulamento-central.yml
          git commit -m "style: ajustar botão da Central no mobile"
          git push origin HEAD:feat/regulamento-central-link
